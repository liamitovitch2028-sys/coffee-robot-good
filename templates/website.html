<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Machine</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            padding: 20px;
        }

        /* Main card */

        .container {
            background: white;

            width: 100%;
            max-width: 400px;

            padding: 35px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
        }

        /* Title */

        h1 {
            margin: 0 0 30px 0;

            color: #4b2e1f;

            font-size: 30px;
        }

        /* Start button */

        .start-button {
            background: #6f4e37;

            color: white;

            border: none;

            width: 100%;
            max-width: 280px;

            padding: 16px 25px;

            font-size: 18px;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.2s;
        }

        .start-button:hover {
            background: #5a3d2b;
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* Bot ID button */

        .bot-id-button {
            position: fixed;

            top: 20px;
            right: 20px;

            background: #6f4e37;

            color: white;

            border: none;

            padding: 10px 18px;

            font-size: 16px;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.2s;

            z-index: 10;
        }

        .bot-id-button:hover {
            background: #5a3d2b;
        }

        /* Status */

        .status-box {
            margin-top: 30px;
        }

        .status-box h3 {
            margin-bottom: 10px;

            color: #4b2e1f;
        }

        .status-light {
            width: 25px;
            height: 25px;

            background: red;

            border-radius: 50%;

            display: inline-block;

            margin-top: 5px;
        }

        #status-text {
            font-size: 18px;

            margin-top: 10px;

            margin-bottom: 0;
        }

        /* Phone */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 30px 20px;

                border-radius: 18px;
            }

            h1 {
                font-size: 26px;

                margin-bottom: 25px;
            }

            .start-button {
                max-width: none;

                font-size: 17px;

                padding: 15px;
            }

            .bot-id-button {
                top: 12px;
                right: 12px;

                padding: 9px 14px;

                font-size: 14px;

                border-radius: 10px;
            }

            .status-box {
                margin-top: 25px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <h1>Coffee Machine</h1>

        <button
            class="start-button"
            onclick="startCoffee()"
        >
            Start Coffee
        </button>

        <div style="height: 10px;"></div>

        <button
            class="start-button"
            onclick="open_timer()"
        >
            Set Timer
        </button>


        <div class="status-box">

            <h3>Status</h3>

            <div
                class="status-light"
                id="light"
            ></div>

            <p id="status-text">
                Off
            </p>

        </div>

    </div>


    <button
        class="bot-id-button"
        onclick="openID()"
    >
        Bot ID
    </button>


    <script>

        function startCoffee() {

            let botID =
                localStorage.getItem("botID");


            if (!botID) {

                alert("Please enter your Bot ID first.");

                window.location.href = "/id";

                return;
            }


            fetch("/start", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    id: botID
                })

            })
            .then(response => response.text())
            .then(data => {

                console.log(data);

                // Reset timer saved on the browser
                localStorage.removeItem("coffeeTimerEnd");
                localStorage.removeItem("coffeeTimerTarget");
                localStorage.removeItem("coffeeTimerSeconds");

            })
            .catch(error => {
                console.error("Error:", error);
            });


            let light =
                document.getElementById("light");

            let text =
                document.getElementById("status-text");


            light.style.background = "yellow";

            text.innerHTML = "Heating...";


            setTimeout(function() {

                light.style.background = "green";

                text.innerHTML = "Ready";

            }, 1000);

        }


        function openID() {

            window.location.href = "/id";

        }

        function open_timer() {

            window.location.href = "/timer";

        }

    </script>

</body>

</html>
