<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bot ID</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            padding: 20px;
        }


        /* Main card */

        .container {

            background: white;

            width: 100%;

            max-width: 400px;

            padding: 35px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
        }


        /* Title */

        h1 {

            margin: 0 0 25px 0;

            color: #4b2e1f;

            font-size: 28px;
        }


        /* Input */

        input {

            width: 100%;

            padding: 14px;

            font-size: 17px;

            border-radius: 10px;

            border: 1px solid #ccc;

            outline: none;

            margin-bottom: 15px;

            text-align: center;
        }


        input:focus {

            border-color: #6f4e37;

            box-shadow: 0 0 0 2px rgba(111,78,55,0.1);
        }


        input:disabled {

            background: #eeeeee;

            cursor: not-allowed;
        }


        /* Buttons */

        .button-container {

            display: flex;

            gap: 10px;

            width: 100%;

            margin-top: 5px;
        }


        button {

            background: #6f4e37;

            color: white;

            border: none;

            padding: 13px 20px;

            font-size: 16px;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.2s;

            flex: 1;
        }


        button:hover {

            background: #5a3d2b;
        }


        button:active {

            transform: scale(0.98);
        }


        button:disabled {

            background: #999;

            cursor: not-allowed;

            transform: none;
        }


        /* Messages */

        #message {

            margin-top: 20px;

            font-size: 16px;

            font-weight: bold;

            color: #c0392b;

            background-color: #fbeaea;

            padding: 10px;

            border-radius: 10px;

            min-height: 0;
        }


        #timer {

            margin-top: 10px;

            font-size: 16px;

            font-weight: bold;

            color: #6f4e37;
        }


        /* Phone */

        @media (max-width: 480px) {

            body {

                padding: 15px;
            }


            .container {

                padding: 30px 20px;

                border-radius: 18px;
            }


            h1 {

                font-size: 25px;
            }


            input {

                font-size: 16px;

                padding: 14px;
            }


            .button-container {

                flex-direction: column;

                gap: 8px;
            }


            button {

                width: 100%;

                padding: 14px;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Enter Bot ID</h1>


    <input
        type="text"
        id="botID"
        placeholder="Enter Bot ID"
        autocomplete="off"
    >


    <div class="button-container">

        <button
            id="saveButton"
            onclick="saveID()"
        >
            Save ID
        </button>


        <button onclick="goBack()">
            Back
        </button>

    </div>


    <p id="message"></p>

    <p id="timer"></p>

</div>


<script>

const MAX_ATTEMPTS = 3;

const COOLDOWN_SECONDS = 60;


// Get saved information

let attempts =
    parseInt(localStorage.getItem("botAttempts")) || 0;

let cooldownUntil =
    parseInt(localStorage.getItem("botCooldownUntil")) || 0;


// --------------------------------------------------
// PAGE LOAD
// --------------------------------------------------

window.onload = function() {

    const savedBotID =
        localStorage.getItem("botID");


    if (savedBotID) {

        document.getElementById("botID").value =
            savedBotID;


        const message =
            document.getElementById("message");


        message.style.color = "#27ae60";

        message.style.backgroundColor = "#eafaf1";

        message.innerHTML =
            "Saved Bot ID";

    }


    checkCooldown();

};


// --------------------------------------------------
// SAVE ID
// --------------------------------------------------

async function saveID() {


    if (Date.now() < cooldownUntil) {

        updateCooldown();

        return;

    }


    const botID =
        document.getElementById("botID").value.trim();


    const message =
        document.getElementById("message");


    if (botID === "") {

        message.style.color = "#c0392b";

        message.style.backgroundColor = "#fbeaea";

        message.innerHTML =
            "Please enter a Bot ID.";

        return;

    }


    try {

        const response =
            await fetch("/save_id", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    id: botID
                })

            });


        const data =
            await response.json();


        // CORRECT ID

        if (data.success) {

            localStorage.setItem(
                "botID",
                botID
            );


            attempts = 0;

            localStorage.setItem(
                "botAttempts",
                "0"
            );


            cooldownUntil = 0;

            localStorage.removeItem(
                "botCooldownUntil"
            );


            message.style.color = "#27ae60";

            message.style.backgroundColor = "#eafaf1";

            message.innerHTML =
                "Bot ID saved!";


            setTimeout(function() {

                window.location.href = "/";

            }, 1000);

        }


        // WRONG ID

        else {

            attempts++;


            localStorage.setItem(
                "botAttempts",
                attempts
            );


            if (attempts >= MAX_ATTEMPTS) {

                cooldownUntil =
                    Date.now() +
                    (COOLDOWN_SECONDS * 1000);


                localStorage.setItem(
                    "botCooldownUntil",
                    cooldownUntil
                );


                message.style.color = "#c0392b";

                message.style.backgroundColor = "#fbeaea";

                message.innerHTML =
                    "Try again later.";


                updateCooldown();

            }


            else {

                const remaining =
                    MAX_ATTEMPTS - attempts;


                message.style.color = "#c0392b";

                message.style.backgroundColor = "#fbeaea";

                message.innerHTML =
                    "Invalid Bot ID. " +
                    remaining +
                    " attempt" +
                    (remaining === 1 ? "" : "s") +
                    " remaining.";

            }

        }

    }


    catch (error) {

        console.error(error);


        message.style.color = "#c0392b";

        message.style.backgroundColor = "#fbeaea";

        message.innerHTML =
            "Could not connect to the server.";

    }

}


// --------------------------------------------------
// CHECK COOLDOWN
// --------------------------------------------------

function checkCooldown() {

    if (Date.now() < cooldownUntil) {

        updateCooldown();

    }

    else {

        if (cooldownUntil !== 0) {

            attempts = 0;

            localStorage.setItem(
                "botAttempts",
                "0"
            );

            localStorage.removeItem(
                "botCooldownUntil"
            );

            cooldownUntil = 0;

        }


        document.getElementById("timer").innerHTML = "";

    }

}


// --------------------------------------------------
// COUNTDOWN
// --------------------------------------------------

function updateCooldown() {

    const timer =
        document.getElementById("timer");


    const button =
        document.getElementById("saveButton");


    const input =
        document.getElementById("botID");


    button.disabled = true;

    input.disabled = true;


    // Clear any previous timer

    if (window.cooldownInterval) {

        clearInterval(window.cooldownInterval);

    }


    window.cooldownInterval =
        setInterval(function() {

            const remaining =
                Math.ceil(
                    (cooldownUntil - Date.now()) / 1000
                );


            if (remaining <= 0) {

                clearInterval(
                    window.cooldownInterval
                );


                attempts = 0;

                localStorage.setItem(
                    "botAttempts",
                    "0"
                );


                localStorage.removeItem(
                    "botCooldownUntil"
                );


                cooldownUntil = 0;


                button.disabled = false;

                input.disabled = false;


                timer.innerHTML = "";


                const message =
                    document.getElementById("message");


                message.style.color = "#27ae60";

                message.style.backgroundColor = "#eafaf1";

                message.innerHTML =
                    "You can try again now.";


                return;

            }


            const minutes =
                Math.floor(remaining / 60);


            const seconds =
                remaining % 60;


            let timeText;


            if (minutes > 0) {

                timeText =
                    minutes +
                    "m " +
                    seconds
                        .toString()
                        .padStart(2, "0") +
                    "s";

            }

            else {

                timeText =
                    seconds + "s";

            }


            timer.innerHTML =
                "Try again in " +
                timeText;


        }, 250);

}


// --------------------------------------------------
// BACK BUTTON
// --------------------------------------------------

function goBack() {

    window.location.href = "/";

}

</script>


</body>

</html>
